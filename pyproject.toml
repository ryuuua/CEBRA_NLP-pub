[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cebra-nlp-public"
version = "0.1.0"
requires-python = ">=3.11"
description = "Minimal public CEBRA NLP trajectory and video tutorial pipeline"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "CEBRA NLP contributors" }]
dependencies = [
    "cebra==0.6.1",
    "hydra-core>=1.3",
    "matplotlib>=3.8",
    "numpy==1.26.4",
    "omegaconf>=2.3",
    "pandas>=2.1,<3",
    "Pillow>=10",
    "plotly>=5",
    "python-dotenv>=1",
    "PyYAML>=6",
    "scikit-learn>=1.3",
    "scipy==1.13.1",
    "seaborn>=0.13",
    "torch>=2.2",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]
hf = [
    "accelerate>=0.33",
    "datasets>=2.21,<3",
    "huggingface-hub>=0.26",
    "sentence-transformers>=2.7",
    "tokenizers>=0.21",
    "transformers>=4.50",
]
tracking = [
    "wandb>=0.17",
]
tuning = [
    "optuna>=3",
]
video = [
    "glcontext>=2",
    "moderngl>=5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "platform_system == 'Linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
