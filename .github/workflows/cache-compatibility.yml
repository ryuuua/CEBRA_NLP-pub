name: cache-compatibility

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  public-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install public package and supported dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "labenv-embedding-cache==0.4.0"
          python -m pip install -e ".[dev]"
          python -m pip check
      - name: Test public writer, validation, reader, and source fallback
        run: python -m pytest -q tests/test_cache_utils.py tests/test_embedding_cache_adapter.py
